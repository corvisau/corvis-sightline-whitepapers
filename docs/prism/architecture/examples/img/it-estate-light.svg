<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 756" width="960" height="756" role="img" aria-label="Example architecture 1: an IT estate on Windmill-hosted Prism" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Example architecture 1: an IT estate on Windmill-hosted Prism</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7380"/></marker>
  <marker id="arrow-wb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d4fc2"/></marker>
</defs>
<rect x="60" y="10" width="880" height="136" rx="14" fill="#f6f8fa" stroke="#d5dbe3" stroke-width="1"/>
<text x="80" y="37" font-size="13" font-weight="700" letter-spacing="1.6" fill="#5b6472">SOURCES</text>
<rect x="80" y="52" width="158" height="66" rx="10" fill="#e3eefb" stroke="#3d6fa8" stroke-width="1.6"/>
<text x="159" y="80.1" text-anchor="middle" font-size="16" font-weight="650" fill="#13263d">Azure VMs</text>
<text x="159" y="100.1" text-anchor="middle" font-size="14" fill="#13263d" opacity="0.86">cloud</text>
<rect x="250" y="52" width="158" height="66" rx="10" fill="#e3eefb" stroke="#6d4fc2" stroke-width="2.6" stroke-dasharray="7 5"/>
<text x="329" y="80.1" text-anchor="middle" font-size="16" font-weight="650" fill="#13263d">CrowdStrike</text>
<text x="329" y="100.1" text-anchor="middle" font-size="14" fill="#13263d" opacity="0.86">EDR</text>
<rect x="420" y="52" width="158" height="66" rx="10" fill="#e3eefb" stroke="#6d4fc2" stroke-width="2.6"/>
<text x="499" y="80.1" text-anchor="middle" font-size="16" font-weight="650" fill="#13263d">Jira Assets</text>
<text x="499" y="100.1" text-anchor="middle" font-size="14" fill="#13263d" opacity="0.86">CMDB</text>
<rect x="590" y="52" width="158" height="66" rx="10" fill="#e3eefb" stroke="#3d6fa8" stroke-width="1.6"/>
<text x="669" y="80.1" text-anchor="middle" font-size="16" font-weight="650" fill="#13263d">Active Directory</text>
<text x="669" y="100.1" text-anchor="middle" font-size="14" fill="#13263d" opacity="0.86">directory</text>
<rect x="760" y="52" width="158" height="66" rx="10" fill="#e3eefb" stroke="#3d6fa8" stroke-width="1.6"/>
<text x="839" y="80.1" text-anchor="middle" font-size="16" font-weight="650" fill="#13263d">Asset register</text>
<text x="839" y="100.1" text-anchor="middle" font-size="14" fill="#13263d" opacity="0.86">spreadsheet</text>
<rect x="60" y="166" width="560" height="576" rx="14" fill="#f6f8fa" stroke="#d5dbe3" stroke-width="1"/>
<text x="80" y="728" font-size="13" font-weight="700" letter-spacing="1.6" fill="#5b6472">WINDMILL WORKSPACE</text>
<rect x="640" y="166" width="300" height="172" rx="14" fill="#f6f8fa" stroke="#5b6472" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="660" y="324" font-size="13" font-weight="700" letter-spacing="1.6" fill="#5b6472">WINDOWS HOST</text>
<path d="M159,118 L159,204" fill="none" stroke="#6b7380" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M329,118 L329,204" fill="none" stroke="#6b7380" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M499,118 L499,204" fill="none" stroke="#6b7380" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M669,118 L669,204" fill="none" stroke="#6b7380" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M839,118 L839,204" fill="none" stroke="#6b7380" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80" y="206" width="520" height="90" rx="10" fill="#dff3f0" stroke="#1f8a80" stroke-width="1.6"/>
<text x="340" y="246.2" text-anchor="middle" font-size="20" font-weight="650" fill="#0d2e2b">Collector scripts</text>
<text x="340" y="268.6" text-anchor="middle" font-size="16.5" fill="#0d2e2b" opacity="0.86">On a schedule: Azure VMs, CrowdStrike, Jira Assets</text>
<rect x="660" y="206" width="260" height="96" rx="10" fill="#dff3f0" stroke="#1f8a80" stroke-width="1.6"/>
<text x="790" y="237.9" text-anchor="middle" font-size="20" font-weight="650" fill="#0d2e2b">Connectors</text>
<text x="790" y="260.4" text-anchor="middle" font-size="16.5" fill="#0d2e2b" opacity="0.86">AD, in PowerShell</text>
<text x="790" y="282.9" text-anchor="middle" font-size="16.5" fill="#0d2e2b" opacity="0.86">Spreadsheet</text>
<rect x="80" y="330" width="250" height="96" rx="10" fill="#dff3f0" stroke="#1f8a80" stroke-width="1.6"/>
<text x="205" y="373.1" text-anchor="middle" font-size="20" font-weight="650" fill="#0d2e2b">Sync engine</text>
<text x="205" y="395.6" text-anchor="middle" font-size="16.5" fill="#0d2e2b" opacity="0.86">Runs the sync rules</text>
<rect x="350" y="330" width="250" height="96" rx="10" fill="#f7e4ef" stroke="#a2477f" stroke-width="1.6"/>
<text x="475" y="361.9" text-anchor="middle" font-size="20" font-weight="650" fill="#3a1029">Review app</text>
<text x="475" y="384.4" text-anchor="middle" font-size="16.5" fill="#3a1029" opacity="0.86">Operators decide</text>
<text x="475" y="406.9" text-anchor="middle" font-size="16.5" fill="#3a1029" opacity="0.86">in a browser</text>
<rect x="640" y="370" width="300" height="200" rx="10" fill="#fbf0dc" stroke="#b07d1f" stroke-width="1.6"/>
<text x="790" y="431.4" text-anchor="middle" font-size="20" font-weight="650" fill="#3a2806">Prism store</text>
<text x="790" y="453.9" text-anchor="middle" font-size="16.5" fill="#3a2806" opacity="0.86">MongoDB</text>
<text x="790" y="476.4" text-anchor="middle" font-size="16.5" fill="#3a2806" opacity="0.86">Connected datasets</text>
<text x="790" y="498.9" text-anchor="middle" font-size="16.5" fill="#3a2806" opacity="0.86">Consolidated dataset</text>
<text x="790" y="521.4" text-anchor="middle" font-size="16.5" fill="#3a2806" opacity="0.86">Outboxes</text>
<rect x="80" y="610" width="520" height="96" rx="10" fill="#ede8fb" stroke="#6d4fc2" stroke-width="1.6"/>
<text x="340" y="653.1" text-anchor="middle" font-size="20" font-weight="650" fill="#24154f">Jira Assets write-back script</text>
<text x="340" y="675.6" text-anchor="middle" font-size="16.5" fill="#24154f" opacity="0.86">Drains the outbox, creates and updates records</text>
<path d="M600,251 L630,251 L630,400 L638,400" fill="none" stroke="#6b7380" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M860,302 L860,368" fill="none" stroke="#6b7380" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M475,426 L475,500 L638,500" fill="none" stroke="#6b7380" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M205,426 L205,540 L638,540" fill="none" stroke="#6b7380" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M790,570 L790,658 L602,658" fill="none" stroke="#6d4fc2" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow-wb)"/>

<text x="802" y="618" text-anchor="start" font-size="15" font-weight="600" fill="#6d4fc2">outbox</text>
<path d="M80,690 L36,690 L36,85 L58,85" fill="none" stroke="#6d4fc2" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow-wb)"/>
<rect x="137.0" y="580" width="406.0" height="20" rx="4" fill="#f6f8fa"/>
<text x="340" y="594" text-anchor="middle" font-size="15" font-weight="600" fill="#6d4fc2">write back to Jira Assets, and optionally the EDR</text>
</svg>
