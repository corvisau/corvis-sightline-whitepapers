<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-label="Example architecture 2: OT sites on Standalone Prism, one of them air-gapped" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Example architecture 2: OT sites on Standalone Prism, one of them air-gapped</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker>
  <marker id="arrow-wb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a58cf0"/></marker>
</defs>
<rect x="20" y="10" width="450" height="300" rx="14" fill="#1f232a" stroke="#363e4a" stroke-width="1"/>
<text x="40" y="37" font-size="13" font-weight="700" letter-spacing="1.6" fill="#a9b3c1">OT SITE A, BEHIND A DMZ</text>
<rect x="40" y="52" width="130" height="66" rx="10" fill="#16263a" stroke="#6f9fd8" stroke-width="1.6"/>
<text x="105" y="80.1" text-anchor="middle" font-size="16" font-weight="650" fill="#dbe8f7">OT asset DB</text>
<text x="105" y="100.1" text-anchor="middle" font-size="14" fill="#dbe8f7" opacity="0.86">niche system</text>
<rect x="180" y="52" width="130" height="66" rx="10" fill="#16263a" stroke="#6f9fd8" stroke-width="1.6"/>
<text x="245" y="80.1" text-anchor="middle" font-size="16" font-weight="650" fill="#dbe8f7">Site domain</text>
<text x="245" y="100.1" text-anchor="middle" font-size="14" fill="#dbe8f7" opacity="0.86">Active Directory</text>
<rect x="320" y="52" width="130" height="66" rx="10" fill="#16263a" stroke="#6f9fd8" stroke-width="1.6"/>
<text x="385" y="80.1" text-anchor="middle" font-size="16" font-weight="650" fill="#dbe8f7">Site register</text>
<text x="385" y="100.1" text-anchor="middle" font-size="14" fill="#dbe8f7" opacity="0.86">spreadsheet</text>
<path d="M105,118 L105,158" fill="none" stroke="#9aa4b2" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M245,118 L245,158" fill="none" stroke="#9aa4b2" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M385,118 L385,158" fill="none" stroke="#9aa4b2" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="160" width="410" height="120" rx="10" fill="#10302d" stroke="#4fc1b5" stroke-width="1.6"/>
<text x="245" y="203.9" text-anchor="middle" font-size="20" font-weight="650" fill="#d4f1ed">Collector node</text>
<text x="245" y="226.4" text-anchor="middle" font-size="16.5" fill="#d4f1ed" opacity="0.86">Custom OT connector, in Python</text>
<text x="245" y="248.9" text-anchor="middle" font-size="16.5" fill="#d4f1ed" opacity="0.86">AD and spreadsheet connectors</text>
<rect x="490" y="10" width="450" height="300" rx="14" fill="#1f232a" stroke="#a9b3c1" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="510" y="37" font-size="13" font-weight="700" letter-spacing="1.6" fill="#a9b3c1">OT SITE B, AIR-GAPPED</text>
<rect x="510" y="52" width="200" height="66" rx="10" fill="#16263a" stroke="#6f9fd8" stroke-width="1.6"/>
<text x="610" y="80.1" text-anchor="middle" font-size="16" font-weight="650" fill="#dbe8f7">OT asset DB</text>
<text x="610" y="100.1" text-anchor="middle" font-size="14" fill="#dbe8f7" opacity="0.86">niche system</text>
<rect x="720" y="52" width="200" height="66" rx="10" fill="#16263a" stroke="#6f9fd8" stroke-width="1.6"/>
<text x="820" y="80.1" text-anchor="middle" font-size="16" font-weight="650" fill="#dbe8f7">Site register</text>
<text x="820" y="100.1" text-anchor="middle" font-size="14" fill="#dbe8f7" opacity="0.86">spreadsheet</text>
<path d="M610,118 L610,158" fill="none" stroke="#9aa4b2" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M820,118 L820,158" fill="none" stroke="#9aa4b2" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="510" y="160" width="410" height="66" rx="10" fill="#10302d" stroke="#4fc1b5" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="715" y="188.3" text-anchor="middle" font-size="18" font-weight="650" fill="#d4f1ed">Offline connector</text>
<text x="715" y="209.3" text-anchor="middle" font-size="15" fill="#d4f1ed" opacity="0.86">Writes a snapshot file</text>
<rect x="600" y="240" width="230" height="58" rx="10" fill="#352812" stroke="#d9a648" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="715" y="264.1" text-anchor="middle" font-size="16" font-weight="650" fill="#f6e6c6">Snapshot file</text>
<text x="715" y="284.1" text-anchor="middle" font-size="14" fill="#f6e6c6" opacity="0.86">on approved media</text>
<path d="M715,226 L715,238" fill="none" stroke="#9aa4b2" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="350" width="920" height="290" rx="14" fill="#1f232a" stroke="#363e4a" stroke-width="1"/>
<text x="40" y="377" font-size="13" font-weight="700" letter-spacing="1.6" fill="#a9b3c1">CORPORATE NETWORK</text>
<rect x="40" y="394" width="880" height="64" rx="10" fill="#352812" stroke="#d9a648" stroke-width="1.6"/>
<text x="480" y="420.5" text-anchor="middle" font-size="18" font-weight="650" fill="#f6e6c6">Prism store</text>
<text x="480" y="443.0" text-anchor="middle" font-size="16.5" fill="#f6e6c6" opacity="0.86">PostgreSQL: connected datasets, consolidated dataset, outboxes</text>
<rect x="40" y="500" width="540" height="110" rx="10" fill="#10302d" stroke="#4fc1b5" stroke-width="1.6"/>
<text x="310" y="538.9" text-anchor="middle" font-size="20" font-weight="650" fill="#d4f1ed">Central node</text>
<text x="310" y="561.4" text-anchor="middle" font-size="16.5" fill="#d4f1ed" opacity="0.86">Sync engine and operator CLI</text>
<text x="310" y="583.9" text-anchor="middle" font-size="16.5" fill="#d4f1ed" opacity="0.86">Operators review in the review TUI</text>
<rect x="620" y="500" width="300" height="110" rx="10" fill="#16263a" stroke="#a58cf0" stroke-width="2.6"/>
<text x="770" y="538.9" text-anchor="middle" font-size="20" font-weight="650" fill="#dbe8f7">Target CMDB</text>
<text x="770" y="561.4" text-anchor="middle" font-size="16.5" fill="#dbe8f7" opacity="0.86">Receives the consolidated</text>
<text x="770" y="583.9" text-anchor="middle" font-size="16.5" fill="#dbe8f7" opacity="0.86">OT inventory</text>
<path d="M245,280 L245,392" fill="none" stroke="#9aa4b2" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>

<text x="257" y="338" text-anchor="start" font-size="15" font-weight="600" fill="#a9b3c1">snapshots, outbound only</text>
<path d="M715,298 L715,392" fill="none" stroke="#9aa4b2" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

<text x="727" y="338" text-anchor="start" font-size="15" font-weight="600" fill="#a9b3c1">carried out, then uploaded</text>
<path d="M310,460 L310,498" fill="none" stroke="#9aa4b2" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M770,458 L770,498" fill="none" stroke="#a58cf0" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow-wb)"/>

<text x="782" y="484" text-anchor="start" font-size="15" font-weight="600" fill="#a58cf0">write-back</text>
</svg>
